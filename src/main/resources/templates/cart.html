<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('购物车')}">
  <title>购物车 · MyBookStore</title>
</head>
<body class="page-cart">

<header th:replace="~{fragments/layout :: header('category')}"></header>

<main>
  <section class="page-head">
    <div class="wrap">
      <nav class="breadcrumb">
        <a th:href="@{/main}">首页</a><span>/</span><b>购物车</b>
      </nav>
      <div class="page-head__row">
        <div>
          <h1>购物车</h1>
          <p>书籍会在下单后 48 小时内从仓库发出。</p>
        </div>
        <span class="head-note">共 <b th:text="${itemCount}">4</b> 件商品</span>
      </div>
    </div>
  </section>

  <div class="wrap cart-layout">
    <section>
      <table class="cart-table" id="cartTable">
        <thead>
        <tr>
          <th>商品</th>
          <th>单价</th>
          <th>数量</th>
          <th>小计</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${lines}" th:attr="data-price=${line.book.price}">
          <td>
            <div class="cart-product">
              <a class="cart-cover" th:href="@{/product/{sku}(sku=${line.book.sku})}">
                <span th:replace="~{fragments/layout :: cover(${line.book})}"></span>
              </a>
              <div>
                <a th:href="@{/product/{sku}(sku=${line.book.sku})}"><b th:text="${line.book.title}">活着</b></a>
                <small th:text="${line.book.author} + ' · ' + ${line.book.publisher}">余华 · 作家出版社</small>
              </div>
            </div>
          </td>
          <td>
            <span class="price">¥<span th:text="${#numbers.formatDecimal(line.book.price,1,2)}">28.00</span></span>
          </td>
          <td>
            <div class="qty cart-qty">
              <button type="button" data-qty-step="-1" aria-label="减少数量">−</button>
              <input type="text" th:value="${line.qty}" inputmode="numeric" data-qty-input aria-label="购买数量">
              <button type="button" data-qty-step="1" aria-label="增加数量">＋</button>
            </div>
          </td>
          <td>
            <span class="price">¥<span data-line-total th:text="${#numbers.formatDecimal(line.lineTotal,1,2)}">28.00</span></span>
          </td>
          <td><a class="cart-remove" href="#" data-remove>移除</a></td>
        </tr>
        </tbody>
      </table>

      <div class="cart-actions">
        <a class="link-more" th:href="@{/category}">← 继续购物</a>
        <span class="cart-note">满 ¥99 免运费 · 支持七天无理由退换</span>
      </div>
    </section>

    <aside class="cart-summary">
      <h2>订单摘要</h2>
      <div class="summary-row"><span>商品件数</span><b data-item-count th:text="${itemCount}">4</b></div>
      <div class="summary-row"><span>商品金额</span><b>¥<span data-subtotal th:text="${#numbers.formatDecimal(subtotal,1,2)}">160.00</span></b></div>
      <div class="summary-row"><span>运费</span><b>¥<span data-shipping th:text="${#numbers.formatDecimal(shipping,1,2)}">0.00</span></b></div>
      <div class="summary-row"><span>优惠</span><b>− ¥0.00</b></div>

      <div class="coupon">
        <input type="text" placeholder="输入优惠码" aria-label="优惠码">
        <button class="btn btn--sm btn--ghost" type="button">使用</button>
      </div>

      <div class="summary-total">
        <span>应付总额</span>
        <span class="price">¥<span data-total th:text="${#numbers.formatDecimal(total,1,2)}">160.00</span></span>
      </div>

      <a class="btn btn--accent btn--block" th:href="@{/orders}">去结算</a>
      <p class="cart-note">演示页面：结算与支付流程尚未接入后端。</p>
    </aside>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/store.js}"></script>
</body>
</html>
