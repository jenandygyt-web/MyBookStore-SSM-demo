<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}">
  <title>修改密码 · MyBookStore</title>
</head>
<body class="page-account">

<header th:replace="~{fragments/layout :: header('profile')}"></header>

<main>
  <section class="page-head">
    <div class="wrap">
      <nav class="breadcrumb">
        <a th:href="@{/main}">首页</a><span>/</span>
        <a th:href="@{/profile}">会员中心</a><span>/</span><b>修改密码</b>
      </nav>
      <div class="page-head__row">
        <div>
          <h1>修改密码</h1>
          <p>为了账号安全，建议每 90 天更换一次密码。</p>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap account">
    <aside class="account-nav">
      <a th:href="@{/profile}">个人资料</a>
      <a th:href="@{/orders}">我的订单</a>
      <a class="is-active" th:href="@{/password}">修改密码</a>
      <a th:href="@{/login}">退出登录</a>
    </aside>

    <section class="account-body">
      <div class="account-head">
        <span class="avatar">密</span>
        <div>
          <h1>设置新密码</h1>
          <div class="account-meta"><span>建议使用 8 位以上，包含字母与数字</span></div>
        </div>
      </div>

      <form th:action="@{/password}" method="post" style="max-width: 460px;">
        <div class="form-field">
          <label for="currentPassword">当前密码</label>
          <input id="currentPassword" name="currentPassword" type="password" placeholder="请输入当前密码" autocomplete="current-password">
        </div>
        <div class="form-field">
          <label for="newPassword">新密码</label>
          <input id="newPassword" name="newPassword" type="password" placeholder="至少 8 位，含字母与数字" autocomplete="new-password">
        </div>
        <div class="form-field">
          <label for="confirmPassword">确认新密码</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="再次输入新密码" autocomplete="new-password">
        </div>

        <div class="filter-note" style="margin-top: 8px;">
          不要使用与旧密码相同、或包含生日与手机号的组合。演示环境不会真正修改密码。
        </div>

        <div class="form-actions">
          <button class="btn btn--accent" type="submit">确认修改</button>
          <a class="btn btn--ghost" th:href="@{/profile}">取消</a>
          <small>提交后返回会员中心。</small>
        </div>
      </form>
    </section>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/store.js}"></script>
</body>
</html>
