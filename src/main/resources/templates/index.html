<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('欢迎')}">
  <title>欢迎 · MyBookStore</title>
</head>
<body>

<main class="auth">
  <section class="auth__visual">
    <a class="brand" th:href="@{/home}">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.6C10.3 5.2 8 4.6 4.8 4.6v13.2c3.2 0 5.5.6 7.2 2 1.7-1.4 4-2 7.2-2V4.6c-3.2 0-5.5.6-7.2 2Z"/>
          <path d="M12 6.6v13.2"/>
        </svg>
      </span>
      <span class="brand__text"><b>MyBookStore</b><small>墨卷书城</small></span>
    </a>

    <div class="auth__quote">
      “把世界，<br>读给你听。”
      <small>MYBOOKSTORE · 墨卷书城</small>
    </div>

    <div class="auth__stack">
      <th:block th:each="b : ${picks}">
        <span th:replace="~{fragments/layout :: cover(${b})}"></span>
      </th:block>
    </div>
  </section>

  <section class="auth__panel">
    <div class="auth-card">
      <span class="eyebrow">WELCOME HOME</span>
      <h1>欢迎来到墨卷书城</h1>
      <p class="sub">登录后可查看订单、收藏图书，并获得更适合你的阅读推荐。</p>

      <a class="btn btn--accent btn--block" th:href="@{/login}">账号登录 / 注册</a>

      <div class="divider">或者</div>

      <div class="social-row">
        <button class="social-btn" type="button">微信快捷登录</button>
        <button class="social-btn" type="button">支付宝登录</button>
      </div>

      <a class="btn btn--ghost btn--block mt-16" th:href="@{/home}">先逛逛书店 →</a>

      <label class="agreement">
        <input type="checkbox" checked>
        <span>我已阅读并同意《用户协议》和《隐私政策》</span>
      </label>

      <p class="auth-foot">课程演示环境 · 无需真实账号<br>© <span th:text="${year}">2026</span> MyBookStore 墨卷书城</p>
    </div>
  </section>
</main>

</body>
</html>
